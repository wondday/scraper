name: Fork Docker Build & Push

# Builds the crawl4ai server image from this fork's source (so the fork's
# patches are baked in) and publishes it to Docker Hub at wondday/crawl4ai.
# Kept separate from the upstream `docker-release.yml` so syncing with
# unclecode/crawl4ai never overwrites our deploy pipeline.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'tests/**'
      - 'test.py'
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (optional, e.g. v0.8.6-fix1)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAGS="wondday/crawl4ai:latest
          wondday/crawl4ai:sha-${SHA_SHORT}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAGS="${TAGS}
          wondday/crawl4ai:${{ inputs.tag }}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Production target is x86_64 EC2; single-platform build is faster.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INSTALL_TYPE=default
            USE_LOCAL=true

      - name: Summary
        run: |
          echo "## Fork Docker image published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
